<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding-top: 20px;
            gap: 10px;
        }
        .box{
            background-color: darkorange;
            border-radius: 10px;
            height: 200px;
            width: 200px;
            color: white;
            font-weight: 900px;
            font-size: 25px;
            transition: transform 2s ease;
        }
        .box1:hover{
            transform: translate(125px,125px);
            background-color: aquamarine;
        }
        .box2:hover{
            transform: translateX(125px);
        }
        .box3:hover{
            transform: translateY(125px);
        
        }
        .box4:hover{
            transform: rotate(180deg);
            background-color: blue;
        }
        .box5:hover{
            transform: skew(30deg)
        }
        .box6:hover{
            transform: scale(2);
        }
        .box7:hover{
            transform: rotate(40deg) scale(1,4) translateY(50px);
        }
        </style>
</head>

<body>
    <div class="container">
    <div class="box box1">Translate</div>
    <div class="box box2">TranslateX</div>
    <div class="box box3">TranslateY</div>
    <div class="box box4">rotate</div>
    <div class="box box5">skew</div>
    <div class="box box6">scale</div>
    <div class="box box7">multi function</div>

    </div>
</body>
</html>
