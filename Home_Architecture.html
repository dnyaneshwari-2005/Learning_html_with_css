<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Architecture</title>
    <style>
        .house{
            width: 800px;
            height: 600px;
            border: 2px solid black;
            position: relative;
            margin: 50px auto;
            background-color: black;
        }
        .room{
            position: absolute;
            border: 1px solid gray;
            background-color: lightgray;
            padding: 10px;
        }
        .kitch{
            top: 50px;
            left: 50px;
            width: 150px;
            height: 150px;
        }
        .kitchen .fridge{
            font-size: 12px;
            color: blue;
        }
        .living-room{
            top: 50px;
            left: 250px;
            width: 250px;
            height: 200px;
        }
        .living-room .tv{
            font-size: 12px;
            color: red;
            position: absolute;
            top: 50px;
            left: 10px;
        }
        .living-room .sofa{
            font-size: 12px;
            color: green;
            position: absolute;
            top: 100px;
            left: 10px;
        }
        .dining-room{
            top: 250px;
            left: 20px;
            width: 200px;
            height: 150px;
        }
        .bedroom1 {
            top: 300px;
            left: 300px;
            width: 100px;
            height: 100px;
        }
        .bedroom2{
            top: 450px;
            left: 300px;
            width: 100px;
            height: 100px;
        }
        .bedroom3{
            top: 300px;
            left: 450px;
            width: 100px;
            height: 100px;
        }
        .toilet{
            top: 50px;
            left: 550px;
            width: 100px;
            height: 100px;
        }
        .bathroom{
            top: 200px;
            left: 550px;
            width: 100px;
            height: 100px;
        }
        .basement{
            top: 450px;
            left: 20px;
            width: 200px;
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>This is My Home_Architecture...!!(❁´◡`❁)</h1>
    <div class="house">
        <div class="room kitchen">
            Kitchen
            <div class="fridge">Fridge</div>
        </div>
        <div class="room living-room">
            Living Room
            <div class="tv">TV</div>
            <div class="sofa">Sofa</div>
        </div>
        <div class="room dining-room">
            Dining Room
        </div>
        <div class="room bedroom1">
            Bedroom 1
        </div>
        <div class="room bedroom2">
            Bedroom 2
        </div>
        <div class="room bedroom3">
            Bedroom 3
        </div>
        <div class="room toilet">
            Toilet
        </div>
        <div class="room bathroom">
            Bathroom
        </div>
        <div class="room basement">
            Basement
        </div>
    </div>
</body>
</html>
