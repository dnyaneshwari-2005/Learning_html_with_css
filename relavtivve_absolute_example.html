<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rel_abs_ex</title>
    <style>
        .hall{
            position: relative;
            width: 500px;
            height: 500px;
            background-color: black;
            top: 10px;
            left: 20px;

        }
        #TV{
            position: absolute;
            height: 50px;
            width: 200px;
            background-color: chartreuse;
            left: 150px;
        }
        #Sofa{
            position: absolute;
            height: 80px;
            width: 200px;
            background-color: red;
            left: 150px;
            top: 150px;
        }  
         
        #Fridge{
            position: absolute;
            height: 250px;
            width: 50px;
            background-color: yellow;
            right: 200px
            top: 250px;
         }     



    </style>
</head>
<body>
    <div class="hall">
        <div id="TV">TV</div>
        <div id="Sofa">Sofa</div>
        <div id="Fridge">Fridge</div>
    </div>
    
</body>
</html>
