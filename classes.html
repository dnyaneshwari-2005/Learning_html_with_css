<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hover_effect:hover{
            color: black;
            background-color: skyblue;
            font-size: 60px;
            text-shadow: 4px 3px 8px blue;
        }
        .hover_effect{
            color: blue;
        }
        button{
            background-color: blueviolet;
            font-size: 20px;
            color: white;
            border-radius: 10px;
            cursor: pointer;
        }
        button:active{
            background-color: aqua;
            font-size: 30px;
            padding: 20px;
            color: white;
            border-radius: 20px;
        }
        a:visited{
            color:brown;
        }
        input:focus{
            background-color: yellow;
        }
        li{ 
            padding: 10px;
            border:2px solid violet;
            margin-bottom: 10px;
            border-radius: 10px;
        }
        li:nth-child(odd){
           background-color: aquamarine; 
        }
        li:nth-child(even){
         background-color: lightpink;
        }
        li:nth-child(5){
            background-color: red;
        }
        li:first-child{
            background-color: black;
            color:white;
        }
        li:last-child{
            background-color: black;
            color: white;
        }
        input[type="text"]{
            border: 8px solid lightseagreen;
            padding: 15px;
        }
        input[placeholder-color]{
            background-color: black;
            color: white;
        }
        </style>
        </head>
        
<body>
    <input type="text" placeholder="Enter name">
    <ul>
    <li>item 1</li>
    <li>item 2</li>
    <li>item 3</li>
    <li>item 4</li>
    <li>item 5</li>
    <li>item 6</li>
    <li>item 7</li>
    <li>item 8</li>
    <li>item 9</li>
    <li>item 10</li></ul>
    <a href="https://www.awwwards.com/">Click here</a>
    <input type="text" placeholder="Enter name">
    <br><br>
    <button> click me</button>
    <h1 class="hover_effect">Hello Welcome smita & Pramod</h1>
</body>
</html>
